<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Xperimentor DIDAC{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root { --brand: #3b2a6b; --ink: #1a1630; --muted: #6b6585; --line: #e6e3f0; --soft: #f4f3f8; --amber-bg: #fff1cc; --amber-ink: #7a5200; --green-bg: #e3f3ea; --green-ink: #1d6b3f; }
    * { box-sizing: border-box; }
    div, article, span, section { min-width: 0; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--soft); color: var(--ink); overflow-wrap: anywhere; }
    a { color: var(--brand); }
    button, input, select, textarea { font-family: inherit; font-size: 14px; }
    header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 14px 32px; background: #fff; border-bottom: 1px solid var(--line); }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
    .logo i { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); display: block; }
    .logo span { font-weight: 500; color: var(--muted); }
    nav.main { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
    nav.main a { padding: 8px 14px; border-radius: 999px; color: #4a4563; font-weight: 500; font-size: 14px; text-decoration: none; }
    nav.main a.on { background: #eeeaf8; color: var(--brand); font-weight: 600; }
    .who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #4a4563; }
    .who form { margin: 0; }
    .linkbtn { background: none; border: 0; color: var(--brand); font-weight: 600; cursor: pointer; padding: 0; }
    main.page { padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }
    .flash { padding: 12px 16px; border-radius: 12px; background: var(--amber-bg); color: #6b4700; font-size: 14px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 2px rgba(26,22,48,.06), 0 6px 18px rgba(26,22,48,.06); }
    .btn { height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid #d9d5e8; font-weight: 500; }
    .btn.danger { background: #fff; color: #a12d1f; border: 1px solid #e3b4ac; font-weight: 500; height: 40px; font-size: 14px; }
    label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    input.t, select.t, textarea.t { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #d9d5e8; border-radius: 10px; background: #fff; }
    textarea.t { height: auto; padding: 10px 12px; resize: vertical; }
    .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .chip.amber { background: var(--amber-bg); color: var(--amber-ink); }
    .chip.team { background: #eeeaf8; color: var(--brand); }
    .chip.visitor { background: var(--green-bg); color: var(--green-ink); }
    .chip.off { background: #f6e3e0; color: #a12d1f; }
    @media (max-width: 640px) { header.top, main.page { padding-left: 16px; padding-right: 16px; } }
    {% block css %}{% endblock %}
  </style>
</head>
<body>
{% block body %}
  <header class="top">
    <div class="logo"><i></i><div>Xperimentor <span>DIDAC</span></div></div>
    <nav class="main">
      <a href="{{ url_for('gallery') }}" class="{{ 'on' if active == 'leads' }}">Leads</a>
      {% if user.is_admin %}<a href="{{ url_for('team') }}" class="{{ 'on' if active == 'team' }}">Team</a>{% endif %}
      <a href="/export/report.xlsx">Export</a>
    </nav>
    <div class="who">{{ user.name }}
      <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="linkbtn">Sign out</button></form>
    </div>
  </header>
  <main class="page">
    {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
{% endblock %}
</body>
</html>
