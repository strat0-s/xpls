<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DIDAC Leads{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* Warm cream and clay: soft on the eyes, and deliberately unlike Orbit's blue and zinc. */
    :root { --brand: #b5573a; --brand-dark: #97452b; --bright: #cf7a56; --brand-soft: #f8ebe3; --ink: #2b2622; --muted: #8a8076; --line: #ebe4da; --soft: #f7f3ee; --surface: #fffdfa;
            --amber-bg: #fbeec6; --amber-ink: #7a5a12; --green-bg: #e4eddc; --green-ink: #46602f; --red-bg: #f6dcd6; --red-ink: #9b3a2c; --serif: 'Fraunces', Georgia, serif; }
    * { box-sizing: border-box; }
    div, article, span, section { min-width: 0; }
    html { height: 100%; }
    body { margin: 0; min-height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--soft); color: var(--ink); overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
    a { color: var(--brand); }
    button, input, select, textarea { font-family: inherit; font-size: 14px; }
    h1, h2 { font-family: var(--serif); font-weight: 600; }

    .shell { display: flex; min-height: 100vh; }
    aside.side { width: 232px; flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 20px 14px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo i { width: 36px; height: 36px; border-radius: 12px; background: var(--bright); display: flex; align-items: center; justify-content: center; font-style: normal; font-family: var(--serif); font-weight: 700; font-size: 18px; color: #fff; }
    .logo b { display: block; font-family: var(--serif); font-size: 17px; font-weight: 700; letter-spacing: .01em; }
    .logo small { display: block; font-size: 11px; color: var(--muted); margin-top: -1px; }
    aside.side .logo { padding: 4px 8px 22px; }
    nav.main { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    nav.main a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; color: #6b6258; font-weight: 500; font-size: 14px; text-decoration: none; transition: background .15s, color .15s; }
    nav.main a svg { width: 18px; height: 18px; flex: none; }
    nav.main a:hover { background: var(--soft); color: var(--ink); }
    nav.main a.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
    .who { background: var(--soft); border-radius: 14px; padding: 12px; }
    .who .me { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .who .dot { width: 32px; height: 32px; border-radius: 50%; background: var(--bright); color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }
    .who .nm { font-size: 14px; font-weight: 600; }
    .who .rl { font-size: 12px; color: var(--muted); }
    .who form { margin: 0; }
    .who .out { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px; color: var(--muted); cursor: pointer; }
    .who .out:hover { color: var(--brand); }

    main.page { flex: 1; padding: 32px 36px; display: flex; flex-direction: column; gap: 22px; max-width: 1400px; width: 100%; margin: 0 auto; }
    .flash { padding: 12px 16px; border-radius: 12px; background: var(--amber-bg); color: var(--amber-ink); font-size: 14px; }
    .card { background: var(--surface); border-radius: 18px; box-shadow: 0 1px 2px rgba(80,55,35,.05), 0 6px 20px rgba(80,55,35,.06); }
    .btn { height: 40px; padding: 0 20px; border: 1px solid transparent; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .btn:hover { background: var(--brand-dark); }
    .btn.ghost { background: var(--surface); color: #6b6258; border-color: #ddd3c7; font-weight: 500; }
    .btn.ghost:hover { color: var(--brand); border-color: #e2b49d; background: var(--surface); }
    .btn.danger { background: var(--surface); color: var(--red-ink); border-color: #e8c3bb; font-weight: 500; }
    .btn.danger:hover { background: var(--red-bg); }
    label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    input.t, select.t, textarea.t { width: 100%; height: 42px; padding: 0 14px; border: 1px solid #ddd3c7; border-radius: 12px; background: #fff; color: var(--ink); }
    textarea.t { height: auto; padding: 10px 14px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--bright); outline-offset: -1px; border-color: transparent; }
    .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
    .chip.amber { background: var(--amber-bg); color: var(--amber-ink); }
    .chip.team { background: var(--brand-soft); color: var(--brand-dark); }
    .chip.visitor { background: var(--green-bg); color: var(--green-ink); }
    .chip.off { background: var(--red-bg); color: var(--red-ink); }

    @media (max-width: 860px) {
      .shell { flex-direction: column; }
      aside.side { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
      aside.side .logo { padding: 4px 8px; }
      nav.main { flex-direction: row; flex: 1 1 auto; overflow-x: auto; }
      .who { background: none; padding: 0; display: flex; align-items: center; gap: 4px; margin-left: auto; }
      .who .me { margin: 0; } .who .nm, .who .rl { display: none; }
      .who .out { width: auto; }
      main.page { padding: 20px 16px; }
    }
    {% block css %}{% endblock %}
  </style>
</head>
<body>
{% block body %}
<div class="shell">
  <aside class="side">
    <div class="logo"><i>D</i><div><b>DIDAC</b><small>Xperimentor</small></div></div>
    <nav class="main">
      
      <a href="{{ url_for('gallery') }}" class="{{ 'on' if active == 'leads' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Leads</a>
      {% if user.is_admin %}<a href="{{ url_for('team') }}" class="{{ 'on' if active == 'team' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Team</a>{% endif %}
      <a href="{{ url_for('export_page') }}" class="{{ 'on' if active == 'export' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Export</a>
    </nav>
    <div class="who">
      <div class="me"><span class="dot">{{ user.name[:1]|upper }}</span><div><div class="nm">{{ user.name }}</div><div class="rl">{{ 'Admin' if user.is_admin else 'Staff' }}</div></div></div>
      <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="out">Sign out</button></form>
    </div>
  </aside>
  <main class="page">
    {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
</body>
</html>
